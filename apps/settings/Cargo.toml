[package]
name = "nyx-settings"
version = "0.1.1"
description = "A control panel for Omarchy"
license = "MIT"
repository = "https://github.com/design-nexus/nyx-settings"
authors = ["Ken Smith"]
edition = "2024"
default-run = "nyx-settings"

[features]
# Settings for NyxOS: its sidebar, and system pages through the Nyx System Manager.
nyxos = []

[dependencies]
nyx-cloud = { git = "https://github.com/design-nexus/nyx-cloud.git", rev = "a65d14cce64bc0cbce1a8ecfa711fae8a0290835" }
nyx-system-proto = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "3f3c454cdf34cfce571a5ff3802a25817e9301f9" }
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "a258c315f056ac649586fdb55e98613056221411" }
nyx-actions = { git = "https://github.com/design-nexus/nyx-core.git", rev = "a258c315f056ac649586fdb55e98613056221411", default-features = false }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "914b14ec5574ca04cbb985b571cfbfb0a42aae15" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "914b14ec5574ca04cbb985b571cfbfb0a42aae15" }
nyx-share-client = { git = "https://github.com/design-nexus/nyx-share.git", rev = "9c0b1418af2296be13e2ec7c1de2e8e1c6a0341b" }
anyhow = "1.0.104"
async-channel = "2"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml = "1.1.6"
toml_edit = "0.25"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

nyx-accounts-native = { package = "nyx-accounts-service", git = "https://github.com/design-nexus/nyx-accounts.git", rev = "446c48debeeb2b6f0d6a81240b3bbe34e88fe3c5" }

# The nyx-core nyx-design uses (virtual monitors included), so the app carries one nyx-desktop.
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "a258c315f056ac649586fdb55e98613056221411" }
nyx-pim = { git = "https://github.com/design-nexus/nyx-core.git", rev = "2e7937ebd156a1df7d92457f9a3b35aecfc22ac9" }
# At their own revisions: none depends on another nyx-core crate, so the
# app still carries one nyx-core and one nyx-desktop.
nyx-capability = { git = "https://github.com/design-nexus/nyx-core.git", rev = "a258c315f056ac649586fdb55e98613056221411", features = ["glib"] }
nyx-devices = { git = "https://github.com/design-nexus/nyx-core.git", rev = "a258c315f056ac649586fdb55e98613056221411" }
# Flux's fluxd as Nyx's device model (Nyx Connect), for Connected Devices.
nyx-connect = { git = "https://github.com/design-nexus/nyx-core.git", rev = "a258c315f056ac649586fdb55e98613056221411" }
nyx-config = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "3f3c454cdf34cfce571a5ff3802a25817e9301f9" }

[dev-dependencies]
tempfile = "3"
