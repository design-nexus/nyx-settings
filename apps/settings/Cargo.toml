[package]
name = "nyx-settings"
version = "0.1.1"
description = "A control panel for Omarchy"
license = "MIT"
repository = "https://github.com/design-nexus/nyx-settings"
authors = ["Ken Smith"]
edition = "2024"
default-run = "nyx-settings"

[features]
# Settings for NyxOS: its sidebar, and system pages through the Nyx System Manager.
nyxos = []

[dependencies]
nyx-cloud = { git = "https://github.com/design-nexus/nyx-cloud.git", rev = "ba6385f60597a9ca6ebd5fb63836a1ea3dfa0f49" }
nyx-system-proto = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "88962d876b30df66e3c5db3c70f28876b7e39db2" }
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "4378e243aeb09733843996663cd9a5a7f0cbb821" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "78a1910cabe3535f588b3dc7004c378295297ec3" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "78a1910cabe3535f588b3dc7004c378295297ec3" }
nyx-share-client = { git = "https://github.com/design-nexus/nyx-share.git", rev = "53a5cacbc46a4269ba40a0fb17c1ee07f12e5177" }
anyhow = "1.0.104"
async-channel = "2"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml = "1.1.6"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

nyx-accounts-native = { package = "nyx-accounts-service", git = "https://github.com/design-nexus/nyx-accounts.git", rev = "afdc1482cb910746f942556090870d3ec083dd34" }

# Newer than nyx-core above for virtual monitors (nyx-desktop depends on no other nyx-core crate).
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "1b052a7636cbb1ea171ae425d3e0e2498b914713" }
nyx-pim = { git = "https://github.com/design-nexus/nyx-core.git", rev = "4378e243aeb09733843996663cd9a5a7f0cbb821" }
# Newer than the rest of nyx-core above: none depends on another nyx-core crate, so the
# app still carries one nyx-core and one nyx-desktop.
nyx-capability = { git = "https://github.com/design-nexus/nyx-core.git", rev = "43d7c2e7684be8274c764619c5ac3886ed6b9438", features = ["glib"] }
nyx-devices = { git = "https://github.com/design-nexus/nyx-core.git", rev = "43d7c2e7684be8274c764619c5ac3886ed6b9438" }
# Flux's fluxd as Nyx's device model (Nyx Connect), for Connected Devices.
nyx-connect = { git = "https://github.com/design-nexus/nyx-core.git", rev = "43d7c2e7684be8274c764619c5ac3886ed6b9438" }
nyx-config = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "2c051e628af5582516ece1a8790882328194c26b" }

[dev-dependencies]
tempfile = "3"
