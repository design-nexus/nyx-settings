name: Independent application checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    container: archlinux@sha256:e43f1fd80e073992c5f173efbbbf65144170bf60aeb7369940087d63eacea8f4
    steps:
      - name: Prepare Git checkout
        run: |
          printf 'Server = https://archive.archlinux.org/repos/2026/10/20/$repo/os/$arch\n' > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm --needed git
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Dependency publication gate
        run: |
          if grep -R 'file://' --include='Cargo.toml' .; then
            echo 'Local split: publish pinned dependency sources first.'
            exit 1
          fi
      - name: Build prerequisites
        run: |
          source <(sed -n '/^app_info()/,/^}/p' install.sh)
          app_info settings
          bash tools/ci-bootstrap.sh $deps
      - name: Locked build, targeted tests and package
        run: python3 tools/ci.py

  # The NyxOS build (--features nyxos) and its tests, as nyx-packages ships it, with this
  # commit in place of the pinned source.
  nyxos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          github_access_token: ${{ github.token }}
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nyxos
      - name: Build and test the NyxOS package
        run: |
          nix build --print-build-logs "github:nyxos-project/nyx-packages#nyx-settings" \
            --override-input nyx-settings "path:$GITHUB_WORKSPACE"
